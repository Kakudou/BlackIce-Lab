services:
  pgsql:
    image: postgres:17-alpine
    container_name: openaev-pgsql
    hostname: openaev-pgsql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openbas
      TZ: Europe/Paris
    volumes:
      - pgsqldata:/var/lib/postgresql/data
    restart: always
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.20
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "openbas"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: openaev-minio
    hostname: openaev-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - s3data:/data
    ports:
      - "9000:9000"
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.21
    command: server /data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: openaev-rabbitmq
    hostname: openaev-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=rabbit01@openaev-rabbitmq
      - TZ=Europe/Paris
    volumes:
      - type: bind
        source: ./rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
      - amqpdata:/var/lib/rabbitmq
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.22
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: openaev-elasticsearch
    hostname: openaev-elasticsearch
    environment:
      # Comment-out the line below for a cluster of multiple nodes
      - discovery.type=single-node
      # Uncomment the line below below for a cluster of multiple nodes
      # - cluster.name=docker-cluster
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery="ERROR"
      # -XX:UseSVE=0 is necessary for Apple M4 architecture
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE} -Xmx${ELASTIC_MEMORY_SIZE} -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
      - "CLI_JAVA_OPTS=-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
      - TZ=Europe/Paris
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.23
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: curl -s http://openaev-elasticsearch:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 50

  openaev:
    image: openbas/platform:prerelease
    container_name: openaev
    hostname: openaev
    # If you need (see the doc), uncomment to use a bind mount and set the attribute $OPENBAS_EXTRA_TRUSTED_CERTS_DIR (host folder) in your .env
    #volumes:
    #  - $OPENBAS_EXTRA_TRUSTED_CERTS_DIR:/opt/openbas/additional_certs
    environment:
      # OpenBAS General Configuration
      - OPENBAS_BASE-URL=${OPENBAS_BASE_URL}
      - OPENBAS_AUTH-LOCAL-ENABLE=true
      - OPENBAS_ADMIN_EMAIL=${OPENBAS_ADMIN_EMAIL}
      - OPENBAS_ADMIN_PASSWORD=${OPENBAS_ADMIN_PASSWORD}
      - OPENBAS_ADMIN_TOKEN=${OPENBAS_ADMIN_TOKEN}
      - OPENBAS_HEALTHCHECK_KEY=${OPENBAS_HEALTHCHECK_KEY:-ChangeMe}
      - OPENBAS_EXTRA-TRUSTED-CERTS-DIR=/opt/openbas/additional_certs
      # POSTGRES
      - SPRING_DATASOURCE_URL=jdbc:postgresql://openaev-pgsql:5432/openbas
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # MINIO
      - MINIO_ENDPOINT=openaev-minio
      - MINIO_ACCESS-KEY=${MINIO_ROOT_USER}
      - MINIO_ACCESS-SECRET=${MINIO_ROOT_PASSWORD}
      # RABBITMQ
      - OPENBAS_RABBITMQ_HOSTNAME=openaev-rabbitmq
      - OPENBAS_RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - OPENBAS_RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      # ELASTICSEARCH
      - ENGINE_URL=http://openaev-elasticsearch:9200
      # SPRING MAIL Configurations
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST=*
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
      # IMAP Configurations
      - OPENBAS_MAIL_IMAP_ENABLED=${OPENBAS_MAIL_IMAP_ENABLED}
      - OPENBAS_MAIL_IMAP_HOST=${OPENBAS_MAIL_IMAP_HOST}
      - OPENBAS_MAIL_IMAP_PORT=${OPENBAS_MAIL_IMAP_PORT}
      - OPENBAS_MAIL_IMAP_USERNAME=${SPRING_MAIL_USERNAME}
      - OPENBAS_MAIL_IMAP_PASSWORD=${SPRING_MAIL_PASSWORD}
      - OPENBAS_MAIL_IMAP_AUTH=${OPENBAS_MAIL_IMAP_AUTH}
      - OPENBAS_MAIL_IMAP_SSL_ENABLE=${OPENBAS_MAIL_IMAP_SSL_ENABLE}
      - OPENBAS_MAIL_IMAP_SSL_TRUST=*
      - OPENBAS_MAIL_IMAP_STARTTLS_ENABLE=${OPENBAS_MAIL_IMAP_STARTTLS_ENABLE}
      - TZ=Europe/Paris
    ports:
      - "8080:8080" # If you change the host port (the left one) do not forget to update OPENBAS_BASE-URL in you .env
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.24
    depends_on:
      pgsql:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://openaev:8080/api/health?health_access_key=${OPENBAS_HEALTHCHECK_KEY}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  collector-mitre-attack:
    image: openbas/collector-mitre-attack:1.18.14
    container_name: openaev-collector-mitre-attack
    hostname: openaev-collector-mitre-attack
    environment:
      - OPENBAS_URL=http://openaev:8080
      - OPENBAS_TOKEN=${OPENBAS_ADMIN_TOKEN}
      - COLLECTOR_ID=${COLLECTOR_MITRE_ATTACK_ID} # Valid UUIDv4
      - "COLLECTOR_NAME=MITRE ATT&CK"
      - COLLECTOR_LOG_LEVEL=info
      - TZ=Europe/Paris
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.25
    depends_on:
      openaev:
        condition: service_healthy
    restart: always

  collector-openbas:
    image: openbas/collector-openbas:1.18.14
    container_name: openaev-collector-openbas
    hostname: openaev-collector-openbas
    environment:
      - OPENBAS_URL=http://openaev:8080
      - OPENBAS_TOKEN=${OPENBAS_ADMIN_TOKEN}
      - COLLECTOR_ID=${COLLECTOR_OPENBAS_ID} # Valid UUIDv4
      - "COLLECTOR_NAME=OpenBAS Datasets"
      - COLLECTOR_LOG_LEVEL=info
      - TZ=Europe/Paris
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.26
    depends_on:
      openaev:
        condition: service_healthy
    restart: always

volumes:
  pgsqldata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAB_ROOT}/openaev/openbas_persistent_volumes/pgsqldata
  s3data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAB_ROOT}/openaev/openbas_persistent_volumes/s3data
  amqpdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAB_ROOT}/openaev/openbas_persistent_volumes/amqpdata
  esdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAB_ROOT}/openaev/openbas_persistent_volumes/esdata

networks:
  lab_mgmt:
    external: true
    name: blackice_lab_mgmt
