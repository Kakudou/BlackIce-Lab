input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # ---- AGGRESSIVE DROPS (apply to all outputs) ----
  if [host][os] and ![source] and ![destination] and ![network] and ![dns] and ![http] and ![tls] and ![icmp] {
    drop { }
  }
  if [event][kind] == "state" or [event][module] == "system" {
    drop { }
  }
  if ![source] and ![destination] and ![network] and ![dns] and ![http] and ![tls] and ![icmp] and [type] != "flow" and [type] != "dns" and [type] != "http" {
    drop { }
  }

  # ---- SYSLOG FORMATTING (stored in [@metadata] so it doesn't pollute ECS) ----
  # Hostname resolution
  if [docker][container][name] {
    mutate { add_field => { "[@metadata][syslog_host]" => "%{[docker][container][name]}" } }
  } else if [container][name] {
    mutate { add_field => { "[@metadata][syslog_host]" => "%{[container][name]}" } }
  } else if [agent][hostname] {
    mutate { add_field => { "[@metadata][syslog_host]" => "%{[agent][hostname]}" } }
  } else if [host][hostname] {
    mutate { add_field => { "[@metadata][syslog_host]" => "%{[host][hostname]}" } }
  } else {
    mutate { add_field => { "[@metadata][syslog_host]" => "packetbeat" } }
  }

  # Build key=value message for syslog
  ruby {
    code => '
      def put(h,k,v); return if v.nil? || v.to_s.empty?; h[k]=v; end
      h = {}
      put(h,"app","packetbeat")
      put(h,"host", event.get("[@metadata][syslog_host]"))

      if event.get("[dns][question][name]")
        put(h,"event_type","dns")
        put(h,"qname", event.get("[dns][question][name]"))
      elsif event.get("[http][request][method]")
        put(h,"event_type","http")
        put(h,"method", event.get("[http][request][method]"))
        put(h,"url_path", event.get("[url][path]"))
        put(h,"status", event.get("[http][response][status]"))
      elsif event.get("[icmp][type]")
        put(h,"event_type","icmp")
        put(h,"icmp_type", event.get("[icmp][type]"))
      elsif event.get("[network][transport]") && event.get("[source][ip]")
        put(h,"event_type","flow")
        put(h,"proto", event.get("[network][transport]"))
        put(h,"bytes", event.get("[network][bytes]"))
      else
        put(h,"event_type","network")
      end

      put(h,"src_ip",   event.get("[source][ip]"))
      put(h,"src_port", event.get("[source][port]"))
      put(h,"dst_ip",   event.get("[destination][ip]"))
      put(h,"dst_port", event.get("[destination][port]"))

      parts = h.map { |k,v| v.is_a?(String) && v.match(/\s/) ? "#{k}=\"#{v}\"" : "#{k}=#{v}" }
      event.set("[@metadata][syslog_msg]", parts.join(" "))
    '
  }
}

output {
  # ---- ELASTIC SIEM: full ECS events (all events, unmodified) ----
  elasticsearch {
    hosts => ["http://172.42.42.60:9200"]
    user => "elastic"
    password => "${SIEM_ELASTIC_PASSWORD}"
    index => "packetbeat-%{+YYYY.MM.dd}"
  }

  # ---- SYSLOG: formatted key=value messages ----
  syslog {
    host => "172.42.42.10"
    port  => 514
    protocol => "udp"
    rfc => "rfc3164"
    appname => "packetbeat"
    sourcehost => "%{[@metadata][syslog_host]}"
    facility => "local0"
    severity => "informational"
    codec => plain { format => "%{[@metadata][syslog_msg]}" }
  }
}
