services:
  logstash:
    build:
      context: .
      dockerfile: Dockerfile.logstash
    container_name: logstash
    hostname: logstash
    env_file:
      - ../.env
    environment:
      TZ: Europe/Paris
      SIEM_ELASTIC_PASSWORD: ${SIEM_ELASTIC_PASSWORD}
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.50
    ports:
      - "5044:5044" # beats input
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Packetbeat for DVWA database
  packetbeat-dvwa-db:
    image: docker.elastic.co/beats/packetbeat:9.1.3
    container_name: packetbeat-dvwa-db
    network_mode: "container:dvwa-db"
    user: packetbeat
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    environment:
      TZ: Europe/Paris
    volumes:
      - ./packetbeat.yml:/usr/share/packetbeat/packetbeat.yml
    command: --strict.perms=false -e
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Packetbeat for DVWA web application
