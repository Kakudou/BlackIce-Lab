# ---------- Ports ----------
# Transparent HTTP
http_port 3128 ssl-bump \
    cert=/etc/squid/ssl/ca.pem key=/etc/squid/ssl/ca.key \
    generate-host-certificates=on dynamic_cert_mem_cache_size=64MB

visible_hostname squid

# ---------- SSL-Bump policy ----------
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

# ---------- Access Controls ----------
# CRITICAL: Allow traffic from the firewall IP (SNAT'd traffic)
acl firewall_traffic src 172.42.20.254
http_access allow firewall_traffic

# The client IP should be the original source, not Squid's IP
acl localnet src 172.42.10.0/24
acl dmznet src 172.42.20.0/24
acl mgmtnet src 172.42.42.0/24

# Access rules - allow transparent proxy traffic
http_access allow localnet
http_access allow dmznet
http_access allow mgmtnet

http_access deny all

# ---------- Caching / Storage ----------
cache_dir ufs /var/spool/squid 64 16 256
coredump_dir /var/spool/squid
pid_filename /run/squid/squid.pid

# ---------- Logging ----------
access_log stdio:/var/log/squid/access.log combined
cache_log stdio:/var/log/squid/cache.log
cache_store_log none
logfile_rotate 0

# ---------- Network / Performance ----------
forwarded_for on
via on

# Disable caching for debugging
cache deny all
