services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.16
    container_name: elastic-siem
    hostname: elastic-siem
    env_file:
      - ../.env
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${SIEM_ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms${SIEM_ELASTIC_MEMORY_SIZE} -Xmx${SIEM_ELASTIC_MEMORY_SIZE}"
      TZ: Europe/Paris
    ports:
      - "9200:9200"
    volumes:
      - elastic_siem_data:/usr/share/elasticsearch/data
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.60
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u elastic:$${SIEM_ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.16
    container_name: kibana-siem
    hostname: kibana-siem
    env_file:
      - ../.env
    environment:
      ELASTICSEARCH_HOSTS: http://172.42.42.60:9200
      ELASTICSEARCH_SERVICEACCOUNTTOKEN: ${SIEM_KIBANA_SERVICE_TOKEN}
      TZ: Europe/Paris
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      lab_mgmt:
        ipv4_address: 172.42.42.61
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  lab_mgmt:
    external: true
    name: blackice_lab_mgmt

volumes:
  elastic_siem_data:
    name: elastic_siem_elastic_siem_data
    driver: local
